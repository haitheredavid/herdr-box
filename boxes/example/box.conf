# herdr-box host config: copy this directory to boxes/<name>/ (git-ignored) and edit.
# Sourced by bootstrap/bootstrap.sh as POSIX sh.

# The one account on the box. Its SSH public key(s) go in authorized_keys next to
# this file.
BOX_USER="me"

# Login shell: bash or zsh.
BOX_SHELL="bash"

# Optional dotfiles, following the Dev Containers dotfiles convention (empty
# DOTFILES_REPOSITORY: no dotfiles). The box owns a checkout at DOTFILES_TARGET_PATH
# (never under ~/projects), cloned once and then moved to DOTFILES_REF only when
# nothing local would be lost: with a dirty tree or unpushed commits it stays put
# and warns. Empty DOTFILES_REF: the remote's default branch.
# DOTFILES_INSTALL_COMMAND (a path inside the repo) then runs as BOX_USER at every
# boot and deploy; it must be idempotent. Empty: the first that exists of install.sh,
# install, bootstrap.sh, bootstrap, script/bootstrap, setup.sh, setup, script/setup
# (the Codespaces/devcontainer order). Set it, e.g. "linux/setup.sh", when the repo's
# root install.sh isn't the Linux entry point.
DOTFILES_REPOSITORY=""
DOTFILES_REF=""
DOTFILES_TARGET_PATH="~/dotfiles"
DOTFILES_INSTALL_COMMAND=""

# Extra apt packages for this box, space-separated; installed at boot when missing.
# Terraform's boxes.<name>.extra_apt_packages bakes them into the image too.
EXTRA_APT_PACKAGES=""

# Directories (colon-separated) whose mise config files are trusted without a
# prompt. Anything else needs `mise trust` on the box.
MISE_TRUSTED_PATHS=""

# Optional shared llama.cpp server (scripts/llm.sh on the Mac that hosts it), as
# http://<tailnet-host>:<port>. Exported to every shell and terminal as
# LLAMA_CPP_BASE_URL, where omp discovers it (empty: none).
LLAMA_CPP_URL=""
