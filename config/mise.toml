# Toolchain defaults (/etc/mise/conf.d/herdr-box.toml). A repo's own mise.toml
# pins win; mise installs those versions on first use.
[tools]
node = "26"
pnpm = "12"
"npm:typescript" = "latest"
python = "3.14"
uv = "0.13"
rust = { version = "stable", components = "rust-analyzer,rust-src" }
just = "latest"
databricks-cli = "latest"

# Language servers, on PATH through the mise shims for helix (dotfiles
# languages.toml and its built-in defaults), omp (auto-detects them), and
# Claude Code's LSP plugins (enabled in the dotfiles' settings.json).
# Rust: rust-analyzer + rust-src come with the rust toolchain above.
# TypeScript: omp uses `tsc --lsp` from TypeScript 7 above.
"npm:@vtsls/language-server" = "latest"        # helix ts/js
"npm:typescript-language-server" = "latest"    # Claude typescript-lsp; omp in TS <= 6 repos
"npm:vscode-langservers-extracted" = "latest"  # eslint, json, css, html
"npm:@mdx-js/language-server" = "latest"       # helix mdx
ty = "latest"                                  # helix + omp python
ruff = "latest"                                # helix + omp python lint/format
"npm:pyright" = "latest"                       # Claude pyright-lsp (dotfiles omp lsp.json turns it off for omp)
lua-language-server = "latest"
marksman = "latest"                            # needs libicu74 (bootstrap apt)
taplo = "latest"
terraform-ls = "latest"
"npm:bash-language-server" = "latest"
shellcheck = "latest"                          # bash-language-server diagnostics
"npm:yaml-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
