# Toolchain + task entrypoints. First run: mise trust && mise install.
[tools]
shellcheck = "latest"
terraform = "1.14"

[tasks.check]
description = "static: shellcheck + terraform fmt/validate"
run = [
  "shellcheck -x bootstrap/*.sh bootstrap/lib/*.sh bootstrap/phases/*.sh bootstrap/bin/* scripts/*.sh test/*.sh",
  "terraform -chdir=terraform fmt -check -recursive",
  "terraform -chdir=terraform init -input=false >/dev/null",
  "terraform -chdir=terraform validate",
]

[tasks.test]
description = "end-to-end: build the image, boot it, bootstrap, smoke over SSH, replace and re-check (Docker, network): BOX=<box> mise run test"
run = "test/run.sh"

[tasks."tf:init"]
run = "terraform -chdir=terraform init -input=false"

[tasks."tf:plan"]
description = "build images and plan creates/updates (never replaces a running box)"
run = "terraform -chdir=terraform plan -input=false -out=herdr-box.tfplan"

[tasks."tf:apply"]
description = "apply the reviewed plan from tf:plan or tf:replace"
run = "terraform -chdir=terraform apply herdr-box.tfplan"

[tasks."tf:replace"]
description = "plan replacing one box's container (home, state, host keys survive): mise run tf:replace -- <box>, then tf:apply"
usage = 'arg "<box>"'
run = 'terraform -chdir=terraform plan -input=false -replace="module.box[\"$usage_box\"].docker_container.box" -out=herdr-box.tfplan'

[tasks.logs]
description = "follow the in-container bootstrap: mise run logs -- [box]"
usage = 'arg "[box]" default="herdr-box"'
run = 'docker exec "$usage_box" journalctl -f -u herdr-box-early -u herdr-box-bootstrap -o cat'

[tasks."ts:up"]
description = "log the container into your tailnet (once; state persists in a volume): mise run ts:up -- [box]"
usage = 'arg "[box]" default="herdr-box"'
run = 'docker exec -it "$usage_box" tailscale up --hostname="$usage_box" --ssh'

[tasks.backup]
description = "tar a box's home volume into backups/: mise run backup -- [box]"
usage = 'arg "[box]" default="herdr-box"'
run = [
  "mkdir -p backups",
  'docker run --rm -v "$usage_box-home:/home:ro" -v "$PWD/backups:/backups" ubuntu:24.04 tar czf "/backups/$usage_box-home-$(date -u +%Y%m%dT%H%M%SZ).tgz" -C / home',
]

[tasks.deploy]
description = "push bootstrap/, config/ and boxes/<box> and re-run the bootstrap without a restart: mise run deploy -- <ssh-host> [box]"
run = "scripts/deploy.sh"

[tasks.smoke]
description = "smoke-check the box over SSH: mise run smoke -- <ssh-host>"
run = "scripts/smoke.sh"

[tasks.login]
description = "log omp in to a provider via your browser (forwards its OAuth callback): mise run login -- <ssh-host> [provider]"
run = "scripts/login.sh"

[tasks."llm:up"]
description = "on the Mac: run the shared llama.cpp model server and serve it on the tailnet"
run = "scripts/llm.sh up"

[tasks."llm:down"]
run = "scripts/llm.sh down"

[tasks."llm:status"]
run = "scripts/llm.sh status"
